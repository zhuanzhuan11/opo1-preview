function aiCoursePage(){let topics=aiCopy[lang][courseSeries==="codex"?"codexTopics":"workbuddyTopics"];let days=lang==="zh"?["周一","周二","周三","周四","周五"]:lang==="ja"?["月曜日","火曜日","水曜日","木曜日","金曜日"]:["Monday","Tuesday","Wednesday","Thursday","Friday"];return '<div class="intro"><div><h1>'+t("aiCourse")+'</h1><p>'+t("courseDesc")+'</p></div><span class="badge">130</span><p class="muted">'+t("syllabusHint")+'</p></div><section class="panel course-schedule"><div class="heading"><h2>'+t("schedule")+'</h2><span class="badge">'+t("classTime")+'</span></div><div class="schedule-days">'+days.map((d,i)=>'<div><b>'+d+'</b><span>'+String(i+1).padStart(2,"0")+' · 20:00–20:35</span></div>').join("")+'</div><p class="muted">'+t("weekday")+'　 ·　 '+t("weekend")+'</p></section><div class="course-tabs"><button class="'+(courseSeries==="codex"?"on":"")+'" data-course-series="codex">'+t("seriesCodex")+'</button><button class="'+(courseSeries==="workbuddy"?"on":"")+'" data-course-series="workbuddy">'+t("seriesWorkbuddy")+'</button></div><section class="panel"><div class="heading"><h2>'+t("syllabus")+'</h2><a class="catalog-link" href="'+feishuCatalog+'" target="_blank" rel="noopener noreferrer">'+t("catalogLink")+' ↗</a></div><div class="topic-list">'+topics.map(x=>'<span class="tag">'+x+'</span>').join("")+'</div><p class="muted">'+t("syllabusHint")+'</p></section><section class="panel course-enroll"><div><h2>'+t("lessonNumber")+'</h2><p class="muted">'+t("weekday")+' · '+t("classTime")+'</p></div><label>'+t("lessonNumber")+' <select id="course-lesson">'+Array.from({length:130},(_,i)=>'<option value="'+(i+1)+'" '+(i+1===courseSelected?"selected":"")+'>'+t("lesson")+String(i+1).padStart(3,"0")+t("lessonUnit")+'</option>').join("")+'</select></label><div><b>'+t("coursePrice")+': '+localMoney(10)+'</b><small>'+t("opocMax")+'</small></div><button class="primary" data-course-enroll>'+t("enroll")+'</button></section><section class="panel enrollment-list"><b>'+t("courseEnrollDone")+'</b><p>'+ (courseEnrollments.length?courseEnrollments.map(n=>t("lesson")+String(n).padStart(3,"0")+t("lessonUnit")).join(" · "):t("tableEmpty"))+'</p></section>'}
function localMoney(amount){let m=marketConfig[lang];return m.symbol+Number(amount).toLocaleString(m.locale,{minimumFractionDigits:0,maximumFractionDigits:2})+' '+m.currency}
function coursePayment(lessonNo){let o=document.getElementById("overlay"),max=5;o.innerHTML='<div class="modalbg"><div class="modal"><button class="close" data-course-close>×</button><h2>'+t("coursePayTitle")+'</h2><p>'+t("lesson")+String(Number(lessonNo)).padStart(3,"0")+t("lessonUnit")+'　·　'+localMoney(10)+'</p><label>'+t("opocMax")+'<input id="course-opoc" type="number" min="0" max="'+max+'" value="0" style="display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:8px"></label><h3>'+t("pay")+'</h3>'+marketConfig[lang].channels.map((x,i)=>'<label class="payrow"><input type="radio" name="course-p" '+(i===0?"checked":"")+'>'+t("channel"+x[0].toUpperCase()+x.slice(1))+'</label>').join("")+'<button class="primary" data-course-submit>'+t("coursePay")+'</button><p>'+t("coursePayNotice")+'</p></div></div>';o.querySelector("[data-course-close]").onclick=()=>{modal=null;draw()};o.querySelector("[data-course-submit]").onclick=()=>{let value=Number(document.getElementById("course-opoc").value);if(!Number.isFinite(value)||value<0||value>max){toast(t("opocMax"));return}courseEnrollments.push(Number(lessonNo));modal=null;draw();toast(t("courseEnrollDone"))}}
function draw(){document.querySelector(".notice").textContent=labels[lang].notice;document.querySelector(".brand").innerHTML='<span class="logo">opo°</span> '+labels[lang].brand;document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=labels[lang][e.dataset.i18n]);document.querySelector(".foot span:last-child").textContent=labels[lang].demoFooter;document.getElementById("nav").innerHTML=keys.map(k=>'<button data-go="'+k+'" class="'+(page===k?"on":"")+'">'+icons[k]+'　'+t(k)+'</button>').join('');document.getElementById("mobile").innerHTML=["home","shop","pointsMall","quickPay","orders","profile"].map(k=>'<button data-go="'+k+'" class="'+(page===k?"on":"")+'"><span>'+icons[k]+'</span>'+t(k)+'</button>').join('');document.getElementById("crumb").textContent=t(page)+" / OPO";document.getElementById("lang").textContent=({zh:"简体中文",ja:"日本語",en:"English"})[lang]+"⌄";let a=document.getElementById("app");if(page==="home")a.innerHTML='<div class="intro"><div><h1>'+t("featured")+'</h1><p>'+t("sub")+'</p></div><div class="ai-home-menu-wrap"><button class="ai-home-menu-toggle" data-ai-menu-toggle aria-expanded="false">'+t("aiHomeTitle")+'　⌄</button><div class="ai-home-menu-popover" data-ai-menu-popover hidden><div class="ai-service-grid"><button class="panel ai-service-card" data-go="caseAnalysis"><span>🩺</span><b>'+t("caseAnalysis")+'</b><small>'+t("caseDesc")+'</small><strong>'+t("servicePrice")+': '+localMoney(10)+'</strong></button><button class="panel ai-service-card" data-go="industryInfo"><span>🧭</span><b>'+t("industryInfo")+'</b><small>'+t("industryDesc")+'</small><strong>'+t("servicePrice")+': '+localMoney(10)+'</strong></button><button class="panel ai-service-card" data-go="aiCourse"><span>🎓</span><b>'+t("aiCourse")+'</b><small>'+t("courseDesc")+'</small><strong>'+t("coursePrice")+': '+localMoney(10)+'</strong></button></div></div></div></div><section class="hero"><span class="badge">OPO · SELECTED</span><h2>'+t("hero")+'</h2><p>'+t("sub")+'</p><button data-go="shop">'+t("browse")+' →</button><span class="mark">opo°</span></section><div class="stats"><div class="stat"><small>'+t("balance")+'</small><b>1,280 OPoc</b></div><div class="stat"><small>'+t("received")+'</small><b>2</b></div><div class="stat"><small>'+t("saved")+'</small><b>8</b></div></div><div class="heading"><h2>'+t("featured")+'</h2><button data-go="shop">'+t("all")+' →</button></div>'+grid(goods.slice(0,4))+'<div class="heading"><h2>'+t("featured")+'</h2></div>'+grid(goods.slice(4))+'';else if(["shop","shelf","life","pointsMall","redeem"].includes(page))a.innerHTML='<div class="intro"><div><h1>'+t(page)+'</h1><p>'+(page==="redeem"?t("redeemDesc"):t("sub"))+'</p></div><button class="tag" data-search>⌕ '+t("search")+'</button></div><div class="heading"><h2>'+t("category")+'</h2><span class="badge">'+(page==="redeem"?"1,280 OPoc":"精选推荐")+'</span></div>'+grid(goods);else if(page==="wallet"||page==="points")a.innerHTML='<div class="intro"><div><h1>'+t(page)+'</h1><p>'+t("use")+'</p></div></div><div class="panel"><small>'+t("balance")+'</small><h1>1,280 OPoc</h1><span class="badge">'+t("mock")+'</span></div><div class="heading"><h2>'+t("history")+'</h2></div><div class="panel">＋120 OPoc　 '+t("goodsPoints")+'<hr>−80 OPoc　 '+t("discountPoints")+'<hr>＋10 OPoc　 '+t("checkin")+'</div>';else if(page==="orders")a.innerHTML='<div class="intro"><div><h1>'+t("orders")+'</h1><p>'+t("mock")+'</p></div></div><div class="panel">'+goods.slice(0,3).map((p,i)=>'<p>'+p[0]+'　'+productName(p)+'　 '+formatMoney(p[3])+'　 DEMO-00'+(i+1)+'　<button class="add" data-detail="'+i+'">'+t("all")+'</button></p><hr>').join('')+'</div>';else if(page==="aiServices")a.innerHTML=aiServicesPage();else if(page==="caseAnalysis")a.innerHTML=aiFormPage("caseAnalysis");else if(page==="industryInfo")a.innerHTML=aiFormPage("industryInfo");else if(page==="aiCourse")a.innerHTML=aiCoursePage();else if(page==="profile")a.innerHTML=profilePage();else if(page==="quickPay")a.innerHTML=quickPayPage();else if(page==="admin")a.innerHTML=adminPage();else{let desc=page==="referral"?t("refDesc"):page==="redeem"?t("redeemDesc"):t("mock");a.innerHTML='<div class="intro"><div><h1>'+t(page)+'</h1><p>'+desc+'</p></div></div><div class="panel blank"><div><div style="font-size:50px">'+(icons[page]||"✦")+'</div><b>'+t(page)+'</b>'+desc+'<p><button class="add" data-action>'+t("success")+'</button></p></div></div>'}if(modal!==null){if(modalMode==="payment")payment(modal);else if(modalMode==="coursePayment")coursePayment(modal);else if(modalMode==="search")showSearch();else showDetail(modal)}else document.getElementById("overlay").innerHTML="";if(page==="quickPay")bindQuickPay();document.querySelectorAll("[data-auth-open]").forEach(b=>b.onclick=()=>showAuth(b.dataset.authOpen));document.querySelectorAll("[data-auth-logout]").forEach(b=>b.onclick=()=>{demoMember=null;quickPayBuyer="OPO-DEMO-0086";draw()});let aiMenuToggle=document.querySelector("[data-ai-menu-toggle]"),aiMenuPopover=document.querySelector("[data-ai-menu-popover]");if(aiMenuToggle&&aiMenuPopover)aiMenuToggle.onclick=()=>{let open=aiMenuPopover.hidden;aiMenuPopover.hidden=!open;aiMenuToggle.setAttribute("aria-expanded",String(open))};document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;modal=null;draw();scrollTo(0,0)});document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{cart++;toast(t("added"));draw()});document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{modal=Number(b.dataset.detail);modalMode="detail";showDetail(modal)});document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>toast(t("success")));document.querySelectorAll("[data-admin-tab]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;draw()});document.querySelectorAll("[data-admin-action]").forEach(b=>b.onclick=()=>{let key=b.dataset.adminAction;if(key==="product")adminProducts[Number(b.dataset.index)].active=!adminProducts[Number(b.dataset.index)].active;if(key==="order")adminOrders[Number(b.dataset.index)].shipped=true;if(key==="redemption")adminRedemptions[Number(b.dataset.index)].processed=true;draw();toast(t("adminAction"))});document.querySelectorAll("[data-copy-id]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(demoMember?demoMember.id:t("idValue")).catch(()=>{});toast(t("copied"))});document.querySelectorAll("[data-copy-invite]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText("https://eni-opo.com/?ref="+(demoMember?demoMember.id:'OPO-DEMO-0086')).catch(()=>{});toast(t("copied"))});document.querySelectorAll("[data-sync-zc]").forEach(b=>b.onclick=()=>{let state=document.querySelector("[data-sync-state]");if(state)state.textContent=t("syncDemoDone");toast(t("syncDemoDone"))});document.querySelectorAll("[data-save-commission]").forEach(b=>b.onclick=()=>{let next1=Number(document.getElementById("commission-rate1").value),next2=Number(document.getElementById("commission-rate2").value);if(!Number.isFinite(next1)||!Number.isFinite(next2)||next1<0||next2<0||next1+next2>95){toast(t("rateError"));return}rate1=next1;rate2=next2;draw();toast(t("commissionSaved"))});document.querySelectorAll("[data-demo-toast]").forEach(b=>b.onclick=()=>toast(t("adminAction")));document.querySelectorAll("[data-ai-go]").forEach(b=>b.onclick=()=>{page=b.dataset.aiGo;draw();scrollTo(0,0)});document.querySelectorAll("[data-ai-form]").forEach(b=>b.onclick=()=>{let input=document.querySelector("[data-ai-input]"),result=document.querySelector("[data-ai-result]");if(!input||!input.value.trim()){toast(t("inputRequired"));return}result.hidden=false;result.textContent=t("mockResult")});document.querySelectorAll("[data-course-series]").forEach(b=>b.onclick=()=>{courseSeries=b.dataset.courseSeries;draw()});let lessonSelect=document.getElementById("course-lesson");if(lessonSelect)lessonSelect.onchange=()=>{courseSelected=Number(lessonSelect.value)};let enroll=document.querySelector("[data-course-enroll]");if(enroll)enroll.onclick=()=>{courseSelected=Number(document.getElementById("course-lesson").value);modal=courseSelected;modalMode="coursePayment";draw()};let search=document.querySelector("[data-search]");if(search)search.onclick=()=>{modal="search";modalMode="search";showSearch()};document.getElementById("lang").onclick=language}
function language(){let old=document.querySelector(".langmenu");if(old){old.remove();return}let d=document.createElement("div");d.className="langmenu";d.innerHTML='<button data-l="zh">简体中文</button><button data-l="ja">日本語</button><button data-l="en">English</button>';document.querySelector(".top").appendChild(d);d.querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=({zh:"zh-CN",ja:"ja-JP",en:"en"})[lang];d.remove();draw()})}
function showDetail(i){if(i==="search"){showSearch();return}let p=goods[i],o=document.getElementById("overlay");o.innerHTML='<div class="modalbg"><div class="modal"><button class="close" data-close>×</button><div class="art" style="border-radius:12px">'+p[0]+'</div><h2>'+productName(p)+'</h2><p>'+productDesc(p)+'</p><h2>'+formatMoney(p[3])+'　<small>'+p[4]+' OPoc</small></h2><div class="panel">'+t("limit")+'</div><button class="primary" data-pay>'+t("checkout")+'</button></div></div>';o.querySelector("[data-close]").onclick=()=>{modal=null;draw()};o.querySelector("[data-pay]").onclick=()=>payment(p)}
function commissionBreakdown(amount,opoc=0){let fiat=Math.max(0,amount-Math.max(0,opoc)),l1=fiat*rate1/100,l2=fiat*rate2/100,platform=fiat*platformRate/100,net=fiat-l1-l2-platform;return '<div class="binding-box commission-preview"><b>'+t("commissionBreakdown")+'</b><p>'+t("buyerMember")+'：OPO-DEMO-0086</p><p>'+t("fiatPaid")+'：'+formatMoney(fiat)+'</p><p>'+t("opocBurn")+'：'+opoc.toFixed(2)+' OPoc</p><p>'+t("levelOneMember")+'（'+rate1+'%）：'+formatMoney(l1)+'</p><p>'+t("levelTwoMember")+'（'+rate2+'%）：'+formatMoney(l2)+'</p><p>'+t("platformLabel")+'：'+formatMoney(platform)+'</p><p>'+t("merchantNet")+'：'+formatMoney(net)+'</p><small>'+t("commissionBasis")+'</small></div>'}
function payment(p){let o=document.getElementById("overlay"),gross=Number(p[3]);o.innerHTML='<div class="modalbg"><div class="modal"><button class="close" data-close>×</button><h2>'+t("checkout")+'</h2><p>'+productName(p)+'　'+formatMoney(gross)+'</p><label>'+t("limit")+'<input id="points" type="number" min="0" max="'+Math.floor(gross/2)+'" value="0" style="display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:8px"></label><div id="commission-preview-wrap">'+commissionBreakdown(gross,0)+'</div><h3>'+t("settlementTiming")+'</h3><label class="payrow"><input type="radio" name="settlementTiming" value="receipt" checked>'+t("afterReceipt")+'</label><label class="payrow"><input type="radio" name="settlementTiming" value="immediate">'+t("immediateAfterPayment")+'</label><small>'+t("immediateNote")+'</small><h3>'+t("pay")+'</h3>'+marketConfig[lang].channels.map((x,i)=>'<label class="payrow"><input type="radio" name="p" '+(i===0?"checked":"")+'>'+t('channel'+x[0].toUpperCase()+x.slice(1))+'</label>').join('')+'<button class="primary" data-submit>'+t("simulate")+'</button><p>'+t("mock")+'</p></div></div>';o.querySelector("[data-close]").onclick=()=>{modal=null;draw()};let pointsInput=o.querySelector("#points");pointsInput.oninput=()=>{o.querySelector("#commission-preview-wrap").innerHTML=commissionBreakdown(gross,Math.min(gross/2,Math.max(0,Number(pointsInput.value)||0)))};o.querySelector("[data-submit]").onclick=()=>{if(Number(pointsInput.value)>gross/2){toast(t("limit"));return}let timing=o.querySelector('input[name="settlementTiming"]:checked').value;modal=null;modalMode="detail";draw();toast(t("success")+" · "+(timing==="immediate"?t("immediateSelected"):t("afterReceiptSelected")))}}

function showSearch(){let o=document.getElementById("overlay");o.innerHTML='<div class="modalbg"><div class="modal"><button class="close" data-close>×</button><h2>'+t("search")+'</h2><input id="q" placeholder="'+t("searchHint")+'" style="padding:12px;width:100%;border:1px solid var(--line);border-radius:8px"><button class="primary" data-s>'+t("search")+'</button></div></div>';o.querySelector("[data-close]").onclick=()=>{modal=null;draw()};o.querySelector("[data-s]").onclick=()=>{modal=null;modalMode="detail";page="shop";draw();toast(t("search"))}}
function toast(s){let e=document.createElement("div");e.className="toast";e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}draw();
</script></body></html>
